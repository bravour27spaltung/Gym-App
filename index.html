<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Gym-Log</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Falls die App schon beim Laden scheitert (bevor React etwas zeichnet): Fehler anzeigen statt leerer Seite.
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.textContent = 'Die App konnte nicht starten: ' + e.message;
          root.style.cssText = 'font-family:system-ui,sans-serif;padding:16px;color:#c62828';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
